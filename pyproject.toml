[project]
name = "clv-cohort-prediction"
version = "0.1.0"
description = "Cohort retention and customer lifetime value: BG/NBD + Gamma-Gamma against LightGBM, scored on a holdout period"
requires-python = ">=3.10"
dependencies = [
    "pymc-marketing>=0.19",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "openpyxl>=3.1",
    "matplotlib>=3.7",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
